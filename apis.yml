x-coverage:
  state: covered
  reason: covered
  detail: >-
    Every surface on this profile was settled on the operator axis by live probe on 2026-08-30
    before anything was saved, and the operator axis is the whole finding. Western operates
    exactly one class of machine-readable surface itself — identity — and it was missing from
    the June 2026 profile entirely: a Shibboleth IdP registered in the Canadian Access
    Federation aggregate (202 entities, exactly one uwo.ca entityID) and exported to eduGAIN,
    plus a live CAS 3.0 validation endpoint and a CAS-emitted SAML descriptor. Everything else
    readable is a tenancy — Scholaris (Scholars Portal DSpace), Borealis (Scholars Portal
    Dataverse) and Omni (Ex Libris Primo VE on OCUL) — recorded as relationships with
    x-operator tenant, with no vendor contract saved under Western's slug. No OpenAPI exists
    for any of it and none was generated. Deliberate exclusions, each with a reason:
    api.uwo.ca and developer.uwo.ca do not resolve; data.uwo.ca resolves but redirects to the
    Office of Institutional Planning and Budgeting, an HTML dashboard site with no API, so it
    is not recorded as an OpenData surface; the GitHub organisations western-university and
    uwo-ca both exist but hold zero public repositories and carry no name, email, blog or
    location, so neither can be attributed to Western and no GitHubOrganization pointer is
    emitted; the unofficial timetable APIs (cbaron3/uwo-tt-api, shrumit/Western-Timetable-Maker)
    are student projects on non-Western domains with no institutional endorsement and are not
    credited. The one thing that could not be read is OIDC: WTS advertises it, but the
    discovery document and JWKS both return 403.

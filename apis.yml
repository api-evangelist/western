apis:
  - aid: western:identity-federation
    name: Western University Shibboleth Identity Provider (SAML 2.0 metadata)
    description: >-
      Western's institutional identity provider, publishing machine-readable SAML 2.0 metadata
      through the Canadian Access Federation. entityID https://shibidp.uwo.ca/idp/shibboleth,
      mdui:DisplayName "University of Western Ontario", shibmd:Scope uwo.ca,
      registrationAuthority http://www.canarie.ca, registered 2012-01-01. Declares the REFEDS
      Research and Scholarship entity category and asserts REFEDS Sirtfi, and is exported to
      eduGAIN in CAF's interfederation aggregate. SSO endpoints are declared for HTTP-POST,
      HTTP-POST-SimpleSign and HTTP-Redirect, with SOAP artifact resolution and attribute query
      on port 8443. This is institution-operated by definition, it is the most consequential
      machine-readable surface Western runs, and it was absent from the June 2026 profile.
    humanURL: https://wts.uwo.ca/services/o/single-sign-on-sso-saml2-oauth-oidc-cas/index.html
    baseURL: https://caf-shib2ops.ca/CoreServices/caf_metadata_signed_sha256.xml
    x-entity-id: https://shibidp.uwo.ca/idp/shibboleth
    x-entity-id-note: >-
      The entityID is a SAML identifier, not a document location, and returns HTTP 404 when
      fetched. That is normal Shibboleth behaviour: Western's metadata is published through the
      Canadian Access Federation aggregate, which is what baseURL points at. It is recorded here
      as x-entity-id rather than as a pointer so it is never graded as a dead link.
    tags:
    - Identity Federation
    - SAML
    - Shibboleth
    - eduGAIN
    - CANARIE
    - Single Sign-On
    x-operator: institution
    x-operator-evidence: >-
      Entity is under Western's own registrable domain (uwo.ca), self-asserts "University of
      Western Ontario" as its display name, and is registered by CANARIE in the Canadian Access
      Federation aggregate as the only uwo.ca entity present.
    x-developer-usable: false
    x-developer-note: >-
      An end-user login federation, not a developer authorization surface. There is no client
      registration path, no token endpoint and no consent screen an outside developer could
      integrate against; service-provider registration runs through CAF or a WTS request.
    properties:
      - type: Documentation
        url: https://wts.uwo.ca/services/o/single-sign-on-sso-saml2-oauth-oidc-cas/index.html
      - type: Examples
        url: examples/western-shibboleth-idp-caf-metadata-example.xml
      - type: Authentication
        url: authentication/western-authentication.yml
      - type: Conformance
        url: conformance/western-conformance.yml
      - type: Federation
        url: https://caf-shib2ops.ca/CoreServices/caf_metadata_signed_sha256.xml
  - aid: western:sso-cas
    name: Western Single Sign-On (Apereo CAS — CAS 3.0, SAML2, OIDC)
    description: >-
      Western Technology Services operates an Apereo CAS server at ssocas.uwo.ca. The CAS 3.0
      protocol is publicly reachable — /cas/p3/serviceValidate returns a well-formed
      cas:serviceResponse to an anonymous request — and the server also emits a SAML 2.0
      IdP descriptor at /cas/idp/metadata (HTTP 200, IDPSSODescriptor, shibmd:Scope uwo.ca,
      signing certificate CN=ssocas.uwo.ca valid to 2045), and exposes a Spring Boot actuator
      link document at /cas/actuator. OIDC is advertised in the WTS service catalogue but its
      discovery document and JWKS both return 403, so no OIDC surface is publicly usable.
      Integration is request-based through WTS and gated behind institutional affiliation
      rather than open self-service registration.
    humanURL: https://wts.uwo.ca/services/o/single-sign-on-sso-saml2-oauth-oidc-cas/index.html
    baseURL: https://ssocas.uwo.ca/cas
    tags:
    - Identity
    - Authentication
    - SSO
    - SAML
    - CAS
    - OpenID Connect
    x-operator: institution
    x-operator-evidence: >-
      Host ssocas.uwo.ca is under Western's own registrable domain and the TLS and SAML signing
      certificates are both issued to CN=ssocas.uwo.ca.
    x-developer-usable: false
    x-developer-note: >-
      Documented but affiliation-gated. No self-serve client registration, no published scopes,
      no token endpoint reachable anonymously.
    x-caveat: >-
      The SAML descriptor served here carries the stock Apereo CAS placeholder entityID
      https://cas.example.org/idp. It is live and correctly scoped to uwo.ca, but the entityID
      was never configured and this is not the entity registered in the federation.
    properties:
      - type: Documentation
        url: https://wts.uwo.ca/services/o/single-sign-on-sso-saml2-oauth-oidc-cas/index.html
      - type: Authentication
        url: authentication/western-authentication.yml
      - type: Conformance
        url: conformance/western-conformance.yml
  - aid: western:scholaris-rest
    name: Scholarship@Western on Scholaris — DSpace REST API (tenant)
    description: >-
      The HAL+JSON REST API of Western University's Open Repository, reachable anonymously at
      https://uwo.scholaris.ca/server/api. The root document self-reports dspaceName "Western
      University's Open Repository" and dspaceVersion "DSpace 8.4"; /server/api/core/communities
      returns 200 while /server/api/core/items returns 401, so the surface is genuinely
      access-controlled rather than uniformly open. Recorded as a tenant relationship: Western
      owns the content, the DOIs and the admin contact (rsclib@uwo.ca), but the host is
      Scholaris — the national shared DSpace 8 service operated by Scholars Portal for the
      Ontario Council of University Libraries — and the contract shape is upstream DSpace's. No
      specification is saved here for that reason; saving a generic DSpace spec under an
      institution's slug is precisely the misattribution this profile exists to avoid.
    humanURL: https://uwo.scholaris.ca/home
    baseURL: https://uwo.scholaris.ca/server/api
    tags:
    - Research Repository
    - Institutional Repository
    - DSpace
    - REST
    - HAL
    - Open Access
    x-operator: tenant
    x-operator-evidence: >-
      Institution-specific subdomain (uwo.scholaris.ca) on a vendor platform (scholaris.ca,
      operated by Scholars Portal / OCUL). Western's repository name and admin email; Scholars
      Portal's host, software and contract.
    x-vendor: Scholars Portal (Ontario Council of University Libraries) — DSpace 8.4
    properties:
      - type: Documentation
        url: https://uwo.scholaris.ca/home
      - type: APIReference
        url: https://uwo.scholaris.ca/server/api
  - aid: western:scholaris-oai-pmh
    name: Scholarship@Western OAI-PMH 2.0 provider (tenant)
    description: >-
      OAI-PMH 2.0 metadata harvesting for Western University's Open Repository. Identify
      returns repositoryName "Western University's Open Repository", repositoryIdentifier
      uwo.scholaris.ca, adminEmail rsclib@uwo.ca, earliestDatestamp 2025-05-27T13:31:41Z,
      deletedRecord transient, granularity YYYY-MM-DDThh:mm:ssZ. ListMetadataFormats returns
      thirteen prefixes — didl, mods, ore, mets, xoai, dim, rioxx, uketd_dc, qdc, oai_dc, rdf,
      marc, etdms — and ListSets returns DSpace community and collection sets under handle
      prefix 20.500.14721. This is the surface that satisfies the `oai-pmh` domain standard in
      the Kin Score education regime, and it was documented in this repository's README but
      never recorded as an API entry until now.
    humanURL: https://www.lib.uwo.ca/scholarship/scholarshipatwestern.html
    baseURL: https://uwo.scholaris.ca/server/oai/request
    tags:
    - OAI-PMH
    - Metadata Harvesting
    - Research Repository
    - Open Access
    - DSpace
    x-operator: tenant
    x-operator-evidence: >-
      Same host and same operator as the DSpace REST API above — Western's repository running
      on Scholars Portal's national Scholaris service. The OAI implementation is DSpace's.
    x-vendor: Scholars Portal (Ontario Council of University Libraries) — DSpace 8.4
    properties:
      - type: Examples
        url: examples/western-scholaris-oai-identify-example.xml
      - type: Conformance
        url: conformance/western-conformance.yml
  - aid: western:borealis-dataverse
    name: Western University Repository on Borealis — Dataverse API (tenant)
    description: >-
      Western's research data repository, a Dataverse collection with alias "westernu" and
      affiliation "Western University" on Borealis, the Canadian Dataverse Repository operated
      by Scholars Portal. Reachable through the Dataverse 6.8.4 native API at
      https://borealisdata.ca/api/dataverses/westernu, which returns the collection metadata
      and, at /contents, the sub-collections beneath it — including the Western University
      Research Data Repository Dataverse, CFMM, OwenLab and Geomorphology @ Western. A
      subtree search returns 1,504 datasets, each carrying a DataCite DOI on prefix 10.5683.
      Deposit is arranged through rdm@uwo.ca. Recorded as a tenant relationship and previously
      absent from this profile entirely.
    humanURL: https://borealisdata.ca/dataverse/westernu
    baseURL: https://borealisdata.ca/api/dataverses/westernu
    tags:
    - Research Data
    - Dataverse
    - DataCite
    - Open Data
    - Research Repository
    x-operator: tenant
    x-operator-evidence: >-
      Institution-specific account (dataverse alias "westernu", affiliation "Western
      University") on a shared vendor platform (borealisdata.ca, operated by Scholars Portal).
      The DataCite prefix 10.5683 used by its DOIs belongs to Scholars Portal, not to Western.
    x-vendor: Scholars Portal / Borealis — Dataverse 6.8.4
    properties:
      - type: Documentation
        url: https://guides.lib.uwo.ca/rdm
      - type: Conformance
        url: conformance/western-conformance.yml
  - aid: western:omni-primo
    name: Omni library discovery — Ex Libris Primo VE (tenant)
    description: >-
      Western Libraries' discovery layer is Omni, the Ontario Council of University Libraries'
      shared Ex Libris Alma/Primo VE deployment. Western's view is
      ocul-uwo.primo.exlibrisgroup.com with vid=01OCUL_UWO:UWO_DEFAULT. Recorded so the
      relationship is visible, but no contract is saved: the Primo and Alma APIs are Ex Libris
      products documented on developers.exlibrisgroup.com, shared by every Alma customer, and
      crediting them to Western would be the exact misattribution this profile guards against.
    humanURL: https://ocul-uwo.primo.exlibrisgroup.com/discovery/search?vid=01OCUL_UWO:UWO_DEFAULT
    tags:
    - Library
    - Discovery
    - Primo
    - Ex Libris
    - Catalog
    x-operator: tenant
    x-operator-evidence: >-
      Institution-specific subdomain and view id on a generic vendor host
      (primo.exlibrisgroup.com). The platform is Ex Libris's, the consortial tenancy is OCUL's,
      the view is Western's.
    x-vendor: Ex Libris (Clarivate) via the Ontario Council of University Libraries
    properties:
      - type: Documentation
        url: https://www.lib.uwo.ca/

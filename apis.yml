aid: western
name: Western University
x-type: university
x-category: Public Research University
description: >-
  Western University is a public research university in London, Ontario, Canada, ranked #120
  in the QS World University Rankings order used by this cohort. Like almost every university,
  Western is a federation of buyers rather than an API producer: it runs no developer portal,
  no institutional API gateway (api.uwo.ca and developer.uwo.ca do not resolve), publishes no
  OpenAPI for anything, and serves no llms.txt or security.txt. What it genuinely operates is
  identity. Western Technology Services runs a Shibboleth Identity Provider, entityID
  https://shibidp.uwo.ca/idp/shibboleth, registered in the Canadian Access Federation since
  2012 under CANARIE and exported to eduGAIN, declaring the REFEDS Research and Scholarship
  entity category and Sirtfi assurance — machine-readable SAML 2.0 metadata that is the single
  most consequential surface Western publishes. Alongside it runs an Apereo CAS server at
  ssocas.uwo.ca with a live CAS 3.0 validation endpoint and a second SAML descriptor whose
  entityID is still the stock Apereo placeholder. Both are end-user login federations, not
  developer authorization surfaces; OIDC is advertised by WTS but its discovery document
  returns 403. Western's two readable data surfaces are tenancies, not engineering:
  Scholarship@Western moved in 2025 to Scholaris, the national shared DSpace 8.4 service run
  by Scholars Portal (OCUL), exposing a HAL REST API and a conformant OAI-PMH 2.0 provider
  across thirteen metadata formats at uwo.scholaris.ca; and Western's research data lives in a
  1,504-dataset collection on Borealis, the Canadian Dataverse Repository, minting DataCite
  DOIs on Scholars Portal's 10.5683 prefix. Library discovery is an Ex Libris Primo VE view on
  OCUL's shared platform. All four are recorded here as tenant relationships and deliberately
  not credited as Western engineering. There is no official course, timetable or open-data API:
  the academic calendar at westerncalendar.uwo.ca blocks every AI and search crawler in
  robots.txt, the undergraduate timetable is scrape-only, and the only APIs over that data are
  unofficial student projects on GitHub that Western does not endorse.
